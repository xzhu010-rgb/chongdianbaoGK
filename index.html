const answer=`<h3>血糖稳态（Glucose Homeostasis）</h3><p>血糖稳态是机体通过神经—内分泌调节网络，将血液中的葡萄糖浓度维持在相对稳定范围内的动态平衡状态，通常空腹血糖约为 3.9~5.6 mmol/L。</p><h3>血糖稳态系统</h3><p>这是由胰腺、肝脏、肠道、β细胞、α细胞、L细胞以及胰岛素、胰高血糖素、GLP-1 等共同构成的动态网络。</p><h4>1. 核心传感器：葡萄糖激酶（GK）</h4><p>GK 将血糖变化转化为细胞内能量信号，连接感知与效应环节，参与调节胰岛素、胰高血糖素和 GLP-1。</p><h4>2. 器官协作</h4><ul><li><strong>餐后：</strong>胰岛素促进葡萄糖摄取和糖原合成，GLP-1 协同增强胰岛素释放。</li><li><strong>空腹或低血糖：</strong>胰高血糖素促进肝糖原分解和糖异生，防止低血糖。</li><li><strong>神经—内分泌轴：</strong>下丘脑和自主神经系统参与血糖感知及低血糖防御。</li></ul><h4>3. 2 型糖尿病与稳态失衡</h4><p>GK 功能失调可能导致胰岛敏感度降低和肝脏摄取葡萄糖能力下降。多格列艾汀作为 GK 全激活剂，旨在改善葡萄糖刺激的胰岛素和 GLP-1 分泌。</p><h3>总结</h3><p>GK 是连接血糖感知与效应调节的重要功能组件，针对 GK 的调节是恢复血糖稳态、治疗 2 型糖尿病的重要策略。</p><blockquote>内容为 AI 生成，请在分享前与医学部确认内容准确性和合理性。</blockquote>`;
