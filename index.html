const answer=`<h3>血糖稳态（Glucose Homeostasis）</h3><p>血糖稳态是机体通过神经—内分泌调节网络，将血液中的葡萄糖浓度维持在相对稳定范围内的动态平衡状态，通常空腹血糖约为 3.9~5.6 mmol/L。</p><h3>血糖稳态系统</h3><p>这是由胰腺、肝脏、肠道、β细胞、α细胞、L细胞以及胰岛素、胰高血糖素、GLP-1 等共同构成的动态网络。</p><h4>1. 核心传感器：葡萄糖激酶（GK）</h4><p>GK 将血糖变化转化为细胞内能量信号，连接感知与效应环节，参与调节胰岛素、胰高血糖素和 GLP-1。</p><h4>2. 器官协作</h4><ul><li><strong>餐后：</strong>胰岛素促进葡萄糖摄取和糖原合成，GLP-1 协同增强胰岛素释放。</li><li><strong>空腹或低血糖：</strong>胰高血糖素促进肝糖原分解和糖异生，防止低血糖。</li><li><strong>神经—内分泌轴：</strong>下丘脑和自主神经系统参与血糖感知及低血糖防御。</li></ul><h4>3. 2 型糖尿病与稳态失衡</h4><p>GK 功能失调可能导致胰岛敏感度降低和肝脏摄取葡萄糖能力下降。多格列艾汀作为 GK 全激活剂，旨在改善葡萄糖刺激的胰岛素和 GLP-1 分泌。</p><h3>总结</h3><p>GK 是连接血糖感知与效应调节的重要功能组件，针对 GK 的调节是恢复血糖稳态、治疗 2 型糖尿病的重要策略。</p><blockquote>内容为 AI 生成，请在分享前与医学部确认内容准确性和合理性。</blockquote>`;
function addReferences(box){const card=document.createElement('section');card.className='reference-card';card.innerHTML='<div class="ref-head"><strong>参考来源</strong><button class="ref-toggle">全部收起⌃</button></div>';[['多格列艾汀片说明书','国家药品监督管理局　|　2024'],['多格列艾汀治疗2型糖尿病的研究进展','中国临床药理学杂志　|　2023'],['多格列艾汀临床应用专家指导意见','中华内分泌代谢杂志　|　2023'],['FAQ问答 20251010','华领医药内部资料　|　2025']].forEach((x,i)=>{const row=document.createElement('div');row.className='ref-row';row.innerHTML='<span class="ref-index">'+(i+1)+'</span><span class="ref-title"></span><span class="ref-meta"></span>';row.children[1].textContent=x[0];row.children[2].textContent=x[1];card.append(row)});box.append(card);const actions=document.createElement('div');actions.className='actions';actions.innerHTML='<button data-kind="mindmap">生成思维导图</button><button data-kind="summary">生成PPT</button>';box.append(actions);actions.onclick=e=>{const b=e.target.closest('button');if(b)showGenerationFlow(box,actions,b,b.dataset.kind)};}
function showGenerationFlow(box,actions,button,kind){actions.querySelectorAll('button').forEach(x=>x.classList.remove('active'));button.classList.add('active');const mind=kind==='mindmap';let panel=actions.nextElementSibling;if(panel&&!panel.classList.contains('flow-panel')){panel.remove();panel=null}if(!panel){panel=document.createElement('section');panel.className='flow-panel';actions.after(panel)}if(mind){panel.innerHTML='<div class="flow-title"><i>✓</i>思维导图已生成</div><p class="flow-hint">已完成血糖稳态系统的结构化整理，可预览后继续生成 PPT。</p><div class="mindmap-preview"><span class="mindmap-node one">血糖稳态</span><span class="mindmap-node two">GK传感器</span><span class="mindmap-node three">调节轴</span><span class="mindmap-node four">2型糖尿病</span><span class="mindmap-center">血糖稳态系统</span></div><div class="preview-actions"><button type="button" data-preview="regenerate">重新生成</button><button type="button" data-preview="view">查看大图</button></div>';panel.querySelector('[data-preview="regenerate"]').onclick=()=>toast('思维导图已重新生成');panel.querySelector('[data-preview="view"]').onclick=()=>toast('大图预览功能已打开');}else{const hasMind=!!box.querySelector('.mindmap-preview');panel.innerHTML='<div class="flow-title">PPT内容设置 ⓘ</div><p class="flow-hint">选择 PPT 是否包含已生成的思维导图。</p><div class="ppt-settings"><label class="ppt-option"><input type="checkbox" '+(hasMind?'checked':'')+'><span><strong>包含思维导图</strong><small>'+(hasMind?'将已生成的思维导图页面包含在 PPT 中':'勾选后可将思维导图页面加入 PPT，请先生成思维导图')+'</small></span></label><button class="start-ppt" type="button">开始生成PPT</button></div>';const checkbox=panel.querySelector('input');checkbox.onchange=()=>{panel.querySelector('small').textContent=checkbox.checked?'将已生成的思维导图页面包含在 PPT 中':'PPT 仅包含总结要点'};panel.querySelector('.start-ppt').onclick=()=>generatePpt(panel,checkbox.checked,box)}panel.scrollIntoView({behavior:'smooth',block:'nearest'})}
function generatePpt(panel,includeMindmap,box){panel.innerHTML='<div class="generation-status"><span class="spinner"></span>正在生成PPT，请稍候…</div>';setTimeout(()=>{panel.innerHTML='<div class="ppt-card"><div class="ppt-icon">PPT</div><div class="ppt-info"><strong class="ppt-name">GK充电宝_分析报告.pptx</strong><span class="ppt-status"><i>✓</i> PPT已生成，'+(includeMindmap?'包含思维导图':'不包含思维导图')+'</span></div><button class="ppt-download">⇩ 下载PPT</button></div><button class="regenerate" type="button">重新生成PPT</button>';panel.querySelector('.ppt-download').onclick=()=>toast('PPT下载已开始');panel.querySelector('.regenerate').onclick=()=>showGenerationFlow(box,panel.previousElementSibling,panel.previousElementSibling.querySelector('[data-kind="summary"]'),'summary')},550)}
function addMessageActions(target,kind,q){

    row.innerHTML='<span class="assistant-mini-avatar" aria-hidden="true">♙</span><button type="button" data-action="speak" aria-label="朗读回答" title="朗读回答"><span class="action-label">朗读</span></button><button type="button" data-action="like" aria-label="有帮助" title="有帮助"><span class="action-label">赞</span></button><button type="button" data-action="dislike" aria-label="没有帮助" title="没有帮助"><span class="action-label">踩</span></button>';
    row.querySelector('[data-action="speak"]').onclick=()=>{const button=row.querySelector('[data-action="speak"]');button.classList.toggle('active');const speaking=button.classList.contains('active');if(speaking&&'speechSynthesis' in window){window.speechSynthesis.cancel();const text=target.innerText||'';window.speechSynthesis.speak(new SpeechSynthesisUtterance(text))}else if('speechSynthesis' in window){window.speechSynthesis.cancel()}toast(speaking?'正在朗读回答':'已暂停朗读')};
    row.querySelector('[data-action="like"]').onclick=()=>{row.querySelector('[data-action="like"]').classList.toggle('active');row.querySelector('[data-action="dislike"]').classList.remove('active');toast('感谢你的反馈')};
    row.querySelector('[data-action="dislike"]').onclick=()=>{row.querySelector('[data-action="dislike"]').classList.toggle('active');row.querySelector('[data-action="like"]').classList.remove('active');toast('我们会继续改进回答')};
  }
  target.after(row);
  return row;
}
function addCvotPrompt(box){
  const message=document.createElement('div');
  message.className='cvot-message';
  message.innerHTML='<div class="cvot-head"><span class="cvot-bot" aria-hidden="true">♙</span><span>GK充电宝</span><span class="cvot-time">09:41</span></div><div class="cvot-card"><p>为了更准确地回答你，想先确认一下你具体想了解的是：</p><div class="cvot-options" role="radiogroup" aria-label="CVOT 研究证据类型"><div class="cvot-options-title">你想了解的是：</div><button class="cvot-option" type="button" role="radio" aria-checked="false" data-cvot="completed"><span class="cvot-radio" aria-hidden="true"></span><span><strong>已完成的 CVOT 研究</strong><small>多格列艾汀是否有已完成的心血管结局研究（如 3 期 CVOT）及其结果。</small></span></button><button class="cvot-option selected" type="button" role="radio" aria-checked="true" data-cvot="safety"><span class="cvot-radio" aria-hidden="true"></span><span><strong>心血管安全性证据</strong><small>多格列艾汀在临床研究中关于心血管安全性的证据（如 MACE 风险、非劣效性等）。</small></span></button><button class="cvot-option" type="button" role="radio" aria-checked="false" data-cvot="ongoing"><span class="cvot-radio" aria-hidden="true"></span><span><strong>正在进行中的临床研究</strong><small>多格列艾汀目前是否有正在进行中的 CVOT 或其他心血管相关临床研究。</small></span></button><div class="cvot-tip"><b aria-hidden="true">i</b><span>选择后我会继续为你整理对应证据。</span></div></div><button class="cvot-continue" type="button">继续生成回答</button><button class="cvot-more" type="button">或者继续输入补充说明</button></div>';
  box.classList.add('cvot-answer');
  box.innerHTML='';
  box.append(message);
  const options=[...message.querySelectorAll('.cvot-option')];
  options.forEach(option=>option.onclick=()=>{options.forEach(item=>{item.classList.remove('selected');item.setAttribute('aria-checked','false')});option.classList.add('selected');option.setAttribute('aria-checked','true')});
  message.querySelector('.cvot-continue').onclick=()=>{
    const selected=message.querySelector('.cvot-option.selected');
    const title=selected?.querySelector('strong')?.textContent||'心血管安全性证据';
    const response=document.createElement('div');
    response.className='bubble answer cvot-result';
    response.innerHTML='<h3>正在整理 CVOT 研究证据</h3><p>你选择了解：<strong></strong>。</p><p>后续回答将围绕该方向整理研究设计、主要终点、心血管安全性结果及参考来源。</p><blockquote>内容为 AI 生成，请在分享前与医学部确认内容准确性和合理性。</blockquote>';
    response.querySelector('strong').textContent=title;
    box.append(response);
    const button=message.querySelector('.cvot-continue');
    button.disabled=true;
    button.textContent='已提交，正在生成回答';
    setTimeout(()=>{button.textContent='回答已生成';response.scrollIntoView({behavior:'smooth',block:'nearest'})},500);
  };
  message.querySelector('.cvot-more').onclick=()=>{$('input').focus();toast('请补充你想了解的方向')};
}
function ask(q){$('home').hidden=true;const messages=$('messages');messages.replaceChildren();const user=document.createElement('div');user.className='bubble user';user.textContent=q;messages.append(user);addMessageActions(user,'user',q);const box=document.createElement('div');box.className='bubble answer';messages.append(box);if(q===questions[0]){box.innerHTML=answer;addReferences(box)}else if(q===questions[1]){addCvotPrompt(box)}else{box.textContent='已收到你的问题。当前页面为交互演示，尚未接入医学知识库。'}addMessageActions(box,'assistant',q);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}

$('refreshQuestions').onclick=()=>{questionBatchIndex=(questionBatchIndex+1)%questionBatches.length;$('refreshQuestions').classList.add('spin');renderQuestions();setTimeout(()=>$('refreshQuestions').classList.remove('spin'),300)};
